version: '3.9'

services:
  postgres:
    image: postgres:16-alpine

    restart: unless-stopped
    environment:
      POSTGRES_USER: ge_sky_user
      POSTGRES_PASSWORD: ge_sky_pass
      POSTGRES_DB: ge_sky_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ge_sky_user -d ge_sky_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ge_sky_redis_pass
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "ge_sky_redis_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.5

    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ge_sky_meili_master_key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

  mailhog:
    image: mailhog/mailhog:latest

    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - meilisearch
    ports:
      - "4000:3001"
    environment:
      - DATABASE_URL=postgresql://ge_sky_user:ge_sky_pass@postgres:5432/ge_sky_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=ge_sky_redis_pass
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=ge_sky_meili_master_key
    env_file:
      - apps/api/.env

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:

networks:
  default:
    name: ge_sky_network
